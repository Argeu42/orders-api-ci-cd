version: 0.2
phases:
  install:
    commands:
      - npm ci
      # `sam build` shells out to the `esbuild` binary on the PATH (it does
      # not use the project's local node_modules/.bin copy), so it must be
      # installed globally in the CodeBuild environment too — same fix
      # applied locally when running `sam build`/`sam local` in dev.
      - npm install -g esbuild@0.28.2
  build:
    commands:
      - npm run lint
      - npm run typecheck
      - npm run test:unit
      - sam validate
      - sam build
      - >-
        sam deploy
        --stack-name orders-api
        --resolve-s3
        --capabilities CAPABILITY_IAM
        --no-confirm-changeset
        --no-fail-on-empty-changeset
        --parameter-overrides
        ParameterKey=MongoDbSecretName,ParameterValue=orders-api/mongodb-uri
        ParameterKey=MongoDbSecretArn,ParameterValue=arn:aws:secretsmanager:us-east-1:881490110579:secret:orders-api/mongodb-uri-6KKDde
artifacts:
  files:
    - '**/*'
